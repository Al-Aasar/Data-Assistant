name: CI Tests and Agent Evaluations

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Unit Tests and Agent Evaluations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run python -m unittest discover tests -v

      - name: Run multi-agent benchmark evaluations (Offline / Mock)
        run: uv run python evaluations/run_evals.py --mock --save-report

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval-report
          path: evaluations/reports/
          if-no-files-found: ignore

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: data-assistant:latest
